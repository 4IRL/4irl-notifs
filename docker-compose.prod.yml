# Production counterpart of docker-compose.yml, deployed by
# .github/workflows/prod-deploy.yml to /home/4irl-notifs/ on the shared VPS. This is an
# independent docker-compose stack — it is NOT merged into urls4irl's compose file; the
# two apps run as separate projects on the same host.
#
# Ports are bound to 127.0.0.1 only: a persistent Cloudflare Tunnel already running on the
# VPS provides public ingress (human-provisioned; see the Phase 8 runbook). Never bind
# 0.0.0.0 here — the tunnel is the only intended public entry point.
name: 4irl-notifs

services:
  # One-shot init: the ntfy server and the provisioning-api both run as the
  # non-root uid 1000 and share ntfy's auth database over the ntfy-auth volume,
  # so the volumes must be owned by 1000 before either starts. This runs once
  # and exits; the other services wait for it to complete.
  volume-init:
    image: busybox:1.37.0
    container_name: 4irl-notifs-volume-init
    command: chown -R 1000:1000 /var/lib/ntfy /var/cache/ntfy
    user: "0:0"
    volumes:
      - ntfy-auth:/var/lib/ntfy
      - ntfy-cache:/var/cache/ntfy
    restart: "no"

  ntfy:
    restart: unless-stopped
    # LOCKSTEP: keep this tag equal to the ntfy stage in Dockerfile (bundled CLI) and to
    # docker-compose.yml. Bumping this tag is a compose-definition change, so the next deploy
    # recreates ntfy automatically (subscribers drop once — expected for a server upgrade).
    image: binwiederhier/ntfy:v2.26.0
    container_name: 4irl-notifs-ntfy
    command: serve
    user: "1000:1000"
    ports:
      - "127.0.0.1:8090:80"
    depends_on:
      volume-init:
        condition: service_completed_successfully
    volumes:
      - ./ntfy/server.yml:/etc/ntfy/server.yml:ro
      - ntfy-auth:/var/lib/ntfy
      - ntfy-cache:/var/cache/ntfy
    environment:
      # server.yml's base-url/behind-proxy defaults are for the local stack; this env var
      # overrides the file in prod. The public hostname is a fixed, non-secret constant, so
      # it is baked in here as the default (override via an env/.env only if ever needed).
      - NTFY_BASE_URL=${NTFY_BASE_URL:-https://notifs.4irl.app}
      - NTFY_BEHIND_PROXY=true
      # iOS-bridge upstream poll rate-limit token. ntfy natively maps the NTFY_-prefixed
      # env var onto its `upstream-access-token` config key (see ntfy/server.yml), so it
      # must be a real env var on this container — not a /run/secrets/*_FILE like the
      # provisioning-api secrets below (ntfy does not read the *_FILE convention for this
      # setting). The token is secret, so no value is baked in: it defaults to empty (the
      # free unauthenticated bridge — fails open to the lower poll limit). prod-deploy.yml
      # `export`s it from the `NTFY_UPSTREAM_ACCESS_TOKEN` GitHub Actions repo secret into the
      # deploy shell just before `docker compose up`, so set that repo secret to activate the
      # higher poll ceiling (leave it unset for the free bridge). Never commit the real value.
      - NTFY_UPSTREAM_ACCESS_TOKEN=${NTFY_UPSTREAM_ACCESS_TOKEN:-}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --tries=1 http://localhost:80/v1/health -O - | grep -Eo '\"healthy\"\\s*:\\s*true' || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  provisioning-api:
    restart: unless-stopped
    image: ghcr.io/4irl/4irl-notifs-provisioning-api:latest
    container_name: 4irl-notifs-provisioning-api
    ports:
      - "127.0.0.1:8091:8080"
    depends_on:
      ntfy:
        condition: service_healthy
    environment:
      # The bundled ntfy CLI edits the same auth.db the ntfy server uses; these
      # point it at that database without needing the server process.
      - NTFY_BIN=/usr/bin/ntfy
      - NTFY_AUTH_FILE=/var/lib/ntfy/auth.db
      - NTFY_AUTH_DEFAULT_ACCESS=deny-all
      # Wave-2 best-effort dual-write to the person-service Worker (D1 reverse-index
      # personHash -> email). The target hostname is a fixed, non-secret constant, so it
      # is baked in as the default here (like NTFY_BASE_URL above). The Access Service-Token
      # credentials are secret and are delivered as Docker Compose secrets (see the top-level
      # `secrets:` block); the app reads them from the mounted /run/secrets files via the
      # <KEY>_FILE convention, so the values never enter this container's environment.
      # prod-deploy.yml writes ./secrets/* from GitHub Actions secrets just before `up` and
      # deletes them right after — empty secret contents leave the dual-write auth unset,
      # which fails closed and is swallowed (core provisioning is unaffected).
      - PERSON_SERVICE_URL=${PERSON_SERVICE_URL:-https://notifs-people.4irl.app}
      - PERSON_SERVICE_ACCESS_CLIENT_ID_FILE=/run/secrets/PERSON_SERVICE_ACCESS_CLIENT_ID
      - PERSON_SERVICE_ACCESS_CLIENT_SECRET_FILE=/run/secrets/PERSON_SERVICE_ACCESS_CLIENT_SECRET
      # In-cluster HTTP origin of the ntfy server for the admin "send test
      # notification" flow. Use the in-compose service address (ntfy listens on
      # :80 inside the stack), NOT the public https://notifs.4irl.app, so an
      # internal publish never egresses through the tunnel. LOCKSTEP: keep this
      # env in sync with docker-compose.yml.
      - NTFY_PUBLISH_URL=http://ntfy:80
    secrets:
      - PERSON_SERVICE_ACCESS_CLIENT_ID
      - PERSON_SERVICE_ACCESS_CLIENT_SECRET
    volumes:
      - ntfy-auth:/var/lib/ntfy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  ntfy-auth:
  ntfy-cache:

# The person-service Access Service-Token credentials, delivered to
# provisioning-api as tmpfs files at /run/secrets/<NAME>. prod-deploy.yml writes
# these ./secrets/* files from the GitHub Actions secrets of the same name just
# before `docker compose up` and `rm -rf ./secrets/` immediately after, so no
# plaintext secret persists on the host (the same pattern urls4irl uses).
secrets:
  PERSON_SERVICE_ACCESS_CLIENT_ID:
    file: ./secrets/PERSON_SERVICE_ACCESS_CLIENT_ID
  PERSON_SERVICE_ACCESS_CLIENT_SECRET:
    file: ./secrets/PERSON_SERVICE_ACCESS_CLIENT_SECRET
