services:
  # One-shot init: the ntfy server and the provisioning-api both run as the
  # non-root uid 1000 and share ntfy's auth database over the ntfy-auth volume,
  # so the volumes must be owned by 1000 before either starts. This runs once
  # and exits; the other services wait for it to complete.
  volume-init:
    image: busybox:1.37.0
    command: chown -R 1000:1000 /var/lib/ntfy /var/cache/ntfy
    user: "0:0"
    volumes:
      - ntfy-auth:/var/lib/ntfy
      - ntfy-cache:/var/cache/ntfy
    restart: "no"

  ntfy:
    restart: unless-stopped
    # LOCKSTEP: keep equal to Dockerfile's ntfy stage (bundled CLI) and docker-compose.prod.yml.
    image: binwiederhier/ntfy:v2.26.0
    command: serve
    user: "1000:1000"
    environment:
      # Overrides ntfy/server.yml's base-url (shared with prod) so the local
      # stack advertises the host port this project actually published.
      NTFY_BASE_URL: http://localhost:${NTFY_PORT:-8090}
    ports:
      - "127.0.0.1:${NTFY_PORT:-8090}:80"
    depends_on:
      volume-init:
        condition: service_completed_successfully
    volumes:
      - ./ntfy/server.yml:/etc/ntfy/server.yml:ro
      - ntfy-auth:/var/lib/ntfy
      - ntfy-cache:/var/cache/ntfy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --tries=1 http://localhost:80/v1/health -O - | grep -Eo '\"healthy\"\\s*:\\s*true' || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # LOCAL/CI ONLY: the real person-service Worker under `wrangler dev --local` with a local D1, so
  # integration tests can prove the person store's behaviour. Production deploys
  # docker-compose.prod.yml by itself and talks to the Cloudflare-hosted Worker; do not add this
  # service there. No host port is published and no Access headers are needed locally. The D1 state
  # lives inside the container and is lost when it is recreated.
  person-service:
    restart: unless-stopped
    build:
      context: ./person-service
      dockerfile: Dockerfile
    environment:
      - WRANGLER_SEND_METRICS=false
    healthcheck:
      # The CMD applies migrations before serving, so a 200 on /people means the schema is ready.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/people').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  provisioning-api:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${API_PORT:-8091}:8080"
    depends_on:
      ntfy:
        condition: service_healthy
      person-service:
        condition: service_healthy
    environment:
      # The bundled ntfy CLI edits the same auth.db the ntfy server uses; these
      # point it at that database without needing the server process.
      - NTFY_BIN=/usr/bin/ntfy
      - NTFY_AUTH_FILE=/var/lib/ntfy/auth.db
      - NTFY_AUTH_DEFAULT_ACCESS=deny-all
      # In-compose HTTP origin of the ntfy server, used by the admin "send test
      # notification" flow (the only path that makes a real HTTP call to ntfy —
      # everything else shells the CLI). The ntfy service listens on :80 inside
      # the compose network. LOCKSTEP: keep this env in sync with docker-compose.prod.yml.
      - NTFY_PUBLISH_URL=http://ntfy:80
      # Local person-service Worker (local/CI only; prod points at the Cloudflare-hosted Worker
      # in docker-compose.prod.yml). No Access client id/secret: the client omits empty headers.
      - PERSON_SERVICE_URL=http://person-service:8787
      # Internal credential shared only with delivery-api (sent as X-Notifs-Internal-Credential).
      # LOCKSTEP: keep equal to delivery-api's DELIVERY_PROVISIONING_CREDENTIAL below; prod uses the
      # persistent file secret in docker-compose.prod.yml.
      - PROVISIONING_INTERNAL_CREDENTIAL=fedcba98765432100123456789abcdeffedcba98765432100123456789abcdef # dev-only credential; prod uses a persistent file secret
      # Local keeps the credential check log-only (harnesses move to the one door in a later step) and
      # runs the per-app grant check for real so the integration suite exercises it. LOCKSTEP: prod
      # (docker-compose.prod.yml) runs the same two modes.
      - PROVISIONING_INTERNAL_CREDENTIAL_MODE=log-only
      - PROVISIONING_APP_GRANT_MODE=enforce
    volumes:
      - ntfy-auth:/var/lib/ntfy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  delivery-postgres:
    restart: unless-stopped
    # LOCKSTEP: keep this tag equal to docker-compose.prod.yml.
    image: postgres:17.11-alpine3.23
    # LOCKSTEP: keep this command equal to docker-compose.prod.yml. Small on purpose: the VPS has
    # little free RAM, so the default 128 MB shared_buffers is too large a share.
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=20"]
    environment:
      # LOCKSTEP: keep in sync with docker-compose.prod.yml.
      - POSTGRES_USER=delivery
      - POSTGRES_DB=delivery
      - POSTGRES_PASSWORD=delivery-local-dev # dev-only credential; prod uses a file secret
    # local-only: lets delivery-api/internal/migrate/pgstore_integration_test.go open a real pgx
    # connection; prod stays container-network-only (no ports: here).
    ports:
      - "127.0.0.1:${DELIVERY_DB_PORT_HOST:-18300}:5432"
    volumes:
      - delivery-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U delivery -d delivery"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  delivery-migrate:
    restart: "no"
    build:
      context: .
      dockerfile: delivery-api/Dockerfile
    command: ["migrate"]
    environment:
      # LOCKSTEP: keep in sync with docker-compose.prod.yml.
      - DELIVERY_DB_HOST=delivery-postgres
      - DELIVERY_DB_PORT=5432
      - DELIVERY_DB_USER=delivery
      - DELIVERY_DB_NAME=delivery
      - DELIVERY_DB_PASSWORD=delivery-local-dev # dev-only credential; prod uses a file secret
    depends_on:
      delivery-postgres:
        condition: service_healthy
    healthcheck:
      disable: true

  delivery-api:
    restart: unless-stopped
    # LOCKSTEP: keep in sync with docker-compose.prod.yml. Must exceed delivery-api's worst-case graceful
    # shutdown (main.go: shutdownTimeout 26s + backgroundStopTimeout 20s); the Docker default of 10s would
    # SIGKILL an in-flight delivery attempt before its outcome is recorded.
    stop_grace_period: 60s
    build:
      context: .
      dockerfile: delivery-api/Dockerfile
    ports:
      - "127.0.0.1:${DELIVERY_PORT:-8300}:8080"
    environment:
      # LOCKSTEP: keep in sync with docker-compose.prod.yml.
      - DELIVERY_DB_HOST=delivery-postgres
      - DELIVERY_DB_PORT=5432
      - DELIVERY_DB_USER=delivery
      - DELIVERY_DB_NAME=delivery
      - DELIVERY_DB_PASSWORD=delivery-local-dev # dev-only credential; prod uses a file secret
      - DELIVERY_MASTER_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef # dev-only, obviously-fake key; prod uses a persistent file secret
      # Optional old master key for a rotation window; unset locally so delivery-api runs single-key.
      # LOCKSTEP: keep in sync with docker-compose.prod.yml (which reads it from a file secret).
      - DELIVERY_MASTER_KEY_PREVIOUS=${DELIVERY_MASTER_KEY_PREVIOUS:-}
      # In-compose HTTP origin of the ntfy server, used by the ntfy delivery sink (the ntfy service
      # listens on :80 inside the compose network). Unset disables the ntfy sink. LOCKSTEP: keep in
      # sync with docker-compose.prod.yml and with provisioning-api's NTFY_PUBLISH_URL.
      - DELIVERY_NTFY_URL=http://ntfy:80
      # In-compose HTTP origin of provisioning-api, used only by the operator publisher-mint endpoint
      # (POST /v1/admin/apps/{app_id}/ntfy-publisher). Unset disables minting. LOCKSTEP: keep in sync
      # with docker-compose.prod.yml.
      - DELIVERY_PROVISIONING_URL=http://provisioning-api:8080
      # Internal credential delivery-api sends to provisioning-api. LOCKSTEP: keep equal to
      # provisioning-api's PROVISIONING_INTERNAL_CREDENTIAL above; prod uses the same persistent file
      # secret for both (docker-compose.prod.yml).
      - DELIVERY_PROVISIONING_CREDENTIAL=fedcba98765432100123456789abcdeffedcba98765432100123456789abcdef # dev-only credential; prod uses a persistent file secret
      # Per-app cap on scheduled (deliver_at) messages; a new scheduled submit over it is a 429. The
      # default must equal the code default (message.DefaultMaxScheduledPerApp). LOCKSTEP: keep in
      # sync with docker-compose.prod.yml.
      - DELIVERY_MAX_SCHEDULED_PER_APP=${DELIVERY_MAX_SCHEDULED_PER_APP:-1000}
      # Service-wide cap on scheduled messages across all apps; a new scheduled submit over it is a 429
      # ("scheduled message capacity reached"). The default must equal the code default
      # (message.DefaultMaxScheduledTotal). LOCKSTEP: keep in sync with docker-compose.prod.yml.
      - DELIVERY_MAX_SCHEDULED_TOTAL=${DELIVERY_MAX_SCHEDULED_TOTAL:-100000}
      # The audience a GitHub Actions OIDC token must be minted for (app identity exchange). The
      # default must equal the code default (appidentity.DefaultAudience). LOCKSTEP: keep in sync
      # with docker-compose.prod.yml.
      - DELIVERY_OIDC_AUDIENCE=${DELIVERY_OIDC_AUDIENCE:-notifs-delivery}
      # DEV-ONLY, THIS FILE ONLY: the local stack cannot get real GitHub tokens, so it trusts the
      # throwaway key set that scripts/dev-oidc-keys.mjs writes to .local/dev-oidc/ (make local-up
      # generates it first; never committed). docker-compose.prod.yml must set neither variable;
      # TestProdComposeSetsNeitherOIDCDevVariable fails if it does.
      - DELIVERY_OIDC_DEV_MODE=1
      - DELIVERY_OIDC_JWKS_FILE=/run/dev-oidc/jwks.json
    volumes:
      # Long form with create_host_path: false, so a raw `docker compose up` before the key set
      # exists fails loudly instead of Docker creating a root-owned directory at the source.
      - type: bind
        source: ./.local/dev-oidc/jwks.json
        target: /run/dev-oidc/jwks.json
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      provisioning-api:
        condition: service_healthy
      delivery-postgres:
        condition: service_healthy
      delivery-migrate:
        condition: service_completed_successfully
    healthcheck:
      # Readiness (not just liveness): healthy means the DB is reachable and the schema is current.
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/readyz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  ntfy-auth:
  ntfy-cache:
  delivery-pgdata:
