name = "notifs-watchdog"
main = "src/index.ts"
compatibility_date = "2026-07-01"

# Cron-only Worker: no fetch handler, no routes, and NOT reachable at a public
# *.workers.dev URL. Its whole job is the outbound probes plus the Discord post.
workers_dev = false

[triggers]
crons = ["*/5 * * * *"]

# Keep the per-probe and per-run log lines (`watchdog: probe ...`, `watchdog: run ...`) so a past
# alert can be investigated afterwards: Workers & Pages > notifs-watchdog > Logs. Without this they
# are only visible while `wrangler tail` is running.
[observability]
enabled = true

# Last-known state of every probe target lives in one KV key (`state`).
# The id is the account-specific namespace created with
# `wrangler kv namespace create WATCHDOG_STATE` (a resource identifier, not a credential); see the
# ARCHITECTURE.md "Operator runbook: heartbeat watchdog" section. Setting it back to the all-zero
# placeholder makes the deploy-watchdog CI job skip the deploy with a notice instead of failing.
[[kv_namespaces]]
binding = "WATCHDOG_STATE"
id = "37cdc378df264387bf34b08d552a4c3c"

# Secrets (set with `wrangler secret put`, never in [vars]):
#   DISCORD_WEBHOOK_URL       dedicated watchdog Discord webhook
#   CF_ACCESS_CLIENT_ID       Cloudflare Access service token id (notifs-delivery / notifs-api)
#   CF_ACCESS_CLIENT_SECRET   Cloudflare Access service token secret
