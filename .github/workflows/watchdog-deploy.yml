name: Deploy watchdog to Cloudflare Workers

# Runs post-merge only (wired into prod-build-and-deploy.yml as the deploy-watchdog job, in
# parallel with the VPS deploy so the watchdog is deployed independently of the thing it watches).
# While watchdog/wrangler.toml still holds the all-zero placeholder KV namespace id, the preflight
# step skips the install and deploy with a notice, so merges stay green. The job starts deploying
# once the operator fills in the real id - see the "Operator runbook: heartbeat watchdog" in
# ARCHITECTURE.md.
#
# Only CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID reach this workflow. The Worker's runtime
# secrets (DISCORD_WEBHOOK_URL, CF_ACCESS_CLIENT_ID, CF_ACCESS_CLIENT_SECRET) are set by the
# operator with `wrangler secret put` and never pass through CI. There is no D1 here, so unlike
# worker-deploy.yml there is no migrations step.

permissions:
  contents: read
  actions: write   # Actions Cache write for the setup-node npm cache (paired with the caller job's grant)

on:
  workflow_call:
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

jobs:
  WatchdogDeploy:
    name: Build and deploy watchdog to Cloudflare Workers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check for the placeholder KV namespace id
        id: preflight
        run: |
          if grep -Eq '^id = "0{32}"' watchdog/wrangler.toml; then
            echo "::notice::watchdog/wrangler.toml still has the placeholder KV namespace id; skipping the watchdog deploy (see the ARCHITECTURE.md operator runbook)"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup node
        if: steps.preflight.outputs.deploy == 'true'
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: watchdog/package-lock.json

      - name: Install watchdog dependencies
        if: steps.preflight.outputs.deploy == 'true'
        working-directory: watchdog
        run: npm ci

      - name: Deploy to Cloudflare Workers
        if: steps.preflight.outputs.deploy == 'true'
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: watchdog
          command: deploy
