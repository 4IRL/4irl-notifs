name: Build and Deploy Production Stack

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
    types: [closed]

jobs:
  build-prod:
    if: github.event.pull_request.merged == true
    name: 'CD Prod - Build'
    uses: ./.github/workflows/prod-build.yml
    permissions:
      contents: read
      packages: write
      actions: write   # lets the Actions Cache save buildx layers (else "cache reservation failed")

  deploy-prod:
    if: github.event.pull_request.merged == true
    needs: [build-prod, deploy-person-service]
    name: 'CD Prod - Deploy'
    uses: ./.github/workflows/prod-deploy.yml
    permissions: read-all
    secrets:
      PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
      PROD_SSH_USERNAME: ${{ secrets.PROD_SSH_USERNAME }}
      PROD_SSH_PRIVATE_KEY_FILENAME: ${{ secrets.PROD_SSH_PRIVATE_KEY_FILENAME }}
      PROD_SSH_PRIVATE_KEY_VALUE: ${{ secrets.PROD_SSH_PRIVATE_KEY_VALUE }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      # Wave-2 person-service dual-write credentials (optional; empty leaves the dual-write
      # auth unset — fails closed, swallowed — so core provisioning is unaffected).
      PERSON_SERVICE_ACCESS_CLIENT_ID: ${{ secrets.PERSON_SERVICE_ACCESS_CLIENT_ID }}
      PERSON_SERVICE_ACCESS_CLIENT_SECRET: ${{ secrets.PERSON_SERVICE_ACCESS_CLIENT_SECRET }}
      # ntfy iOS-bridge upstream poll token (optional; empty leaves the upstream bridge on
      # ntfy.sh's free/anonymous rate limit — fails open, iOS push still works).
      NTFY_UPSTREAM_ACCESS_TOKEN: ${{ secrets.NTFY_UPSTREAM_ACCESS_TOKEN }}
      # delivery-api Postgres password (required: an empty value makes Postgres initdb fail;
      # the deploy aborts before touching the running stack if it is empty).
      DELIVERY_DB_PASSWORD: ${{ secrets.DELIVERY_DB_PASSWORD }}
      # delivery-api master key for secrets at rest (required: delivery-api refuses to start
      # without it; the deploy aborts before touching the running stack if it is missing).
      DELIVERY_MASTER_KEY: ${{ secrets.DELIVERY_MASTER_KEY }}
      # Internal credential shared by provisioning-api and delivery-api (required; the deploy
      # aborts before touching the VPS if it is missing or not 64 lowercase hex).
      PROVISIONING_INTERNAL_CREDENTIAL: ${{ secrets.PROVISIONING_INTERNAL_CREDENTIAL }}

  # Admin UI (Cloudflare Pages) is independent of the Docker image + VPS stack, so it runs in
  # parallel with build-prod/deploy-prod (no `needs`), gated by the same merged-to-main guard.
  deploy-admin-ui:
    if: github.event.pull_request.merged == true
    name: 'CD Prod - Deploy Admin UI'
    uses: ./.github/workflows/pages-deploy.yml
    permissions:
      contents: read
      actions: write   # lets the Actions Cache save the setup-node npm cache
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # Public ntfy setup page (Cloudflare Pages project notifs-setup, no Access app) is likewise
  # independent of the Docker image + VPS stack, so it runs in parallel (no `needs`), gated by
  # the same merged-to-main guard.
  deploy-setup-page:
    if: github.event.pull_request.merged == true
    name: 'CD Prod - Deploy Setup Page'
    uses: ./.github/workflows/setup-pages-deploy.yml
    permissions:
      contents: read
      actions: write   # lets the Actions Cache save the setup-node npm cache
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # person-service (Cloudflare Worker) builds independently of the Docker image, but
  # `deploy-prod` waits for it (`needs: [build-prod, deploy-person-service]`) so the Worker
  # routes and migration 0003 are live before the API that calls them. Consequence: a failed
  # Worker deploy now skips the VPS deploy (fail closed, intended). Gated by the same
  # merged-to-main guard.
  deploy-person-service:
    if: github.event.pull_request.merged == true
    name: 'CD Prod - Deploy person-service'
    uses: ./.github/workflows/worker-deploy.yml
    permissions:
      contents: read
      actions: write   # lets the Actions Cache save the setup-node npm cache
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # The external watchdog (cron Worker) must keep running when the VPS deploy fails or the VPS is
  # down, so it is deployed in parallel (no `needs`), gated by the same merged-to-main guard. Only
  # the Cloudflare deploy credentials are passed; its runtime secrets are set out-of-band by the
  # operator with `wrangler secret put`.
  deploy-watchdog:
    if: github.event.pull_request.merged == true
    name: 'CD Prod - Deploy watchdog'
    uses: ./.github/workflows/watchdog-deploy.yml
    permissions:
      contents: read
      actions: write   # lets the Actions Cache save the setup-node npm cache
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
