name: Integration Tests

permissions:
  contents: read

on:
  workflow_call:

jobs:
  Integration:
    name: Integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Restic comes from the one pinned definition in ops/backup/pins.env (sha256-checked), never a version literal here.
      - name: Install pinned restic
        run: bash ops/backup/fetch-pinned.sh restic --dest .local/bin

      # Real backup.sh + restore.sh round trip against throwaway Postgres, sqlite and a local restic repo. Runs before
      # the compose stack so the two never compete for memory; CI fails (not skips) when docker or restic is missing.
      - name: Backup live round trip
        env:
          REQUIRE_DOCKER: "1"
        run: make backup-test-live

      - name: Setup node
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '24'

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: provisioning-api/go.mod
          cache-dependency-path: |
            provisioning-api/go.sum
            delivery-api/go.sum

      # The local stack trusts a throwaway JWKS (dev mode) instead of GitHub's keys; it is generated
      # fresh each run, gitignored, and also what the integration harness signs test tokens with.
      - name: Generate dev OIDC keys
        run: make dev-oidc-keys

      - name: Start local stack
        env:
          # A cap of 2 lets the live per-app 429 test run (it skips on a larger cap). Keep in sync
          # with NOTIFS_DELIVERY_MAX_SCHEDULED below; the other live scheduled tests hold at most 2
          # scheduled messages per app at once.
          DELIVERY_MAX_SCHEDULED_PER_APP: "2"
        run: docker compose --project-directory . -f docker-compose.yml up -d --build

      - name: Wait for provisioning-api to be healthy
        run: |
          for _ in $(seq 1 60); do
            STATUS="$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose --project-directory . -f docker-compose.yml ps -q provisioning-api)" || echo "unknown")"
            if [ "$STATUS" = "healthy" ]; then
              echo "provisioning-api is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "provisioning-api did not become healthy in time"
          exit 1

      - name: Wait for delivery-api to be healthy
        run: |
          for _ in $(seq 1 60); do
            STATUS="$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose --project-directory . -f docker-compose.yml ps -q delivery-api)" || echo "unknown")"
            if [ "$STATUS" = "healthy" ]; then
              echo "delivery-api is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "delivery-api did not become healthy in time"
          exit 1

      - name: Verify delivery-migrate exited cleanly
        run: |
          EXIT_CODE="$(docker inspect -f '{{.State.ExitCode}}' "$(docker compose --project-directory . -f docker-compose.yml ps -aq delivery-migrate)")"
          if [ "$EXIT_CODE" != "0" ]; then
            echo "delivery-migrate exited with code $EXIT_CODE"
            exit 1
          fi
          echo "delivery-migrate exited 0"

      - name: Run Go integration tests
        run: |
          CRED="$(COMPOSE='docker compose --project-directory . -f docker-compose.yml' sh scripts/internal-credential.sh)"
          echo "::add-mask::$CRED"
          cd provisioning-api
          NOTIFS_INTERNAL_CREDENTIAL="$CRED" go test -tags integration ./...

      # The stack is on the default (hold on): TestHold* run, the cap tests skip (no small caps here).
      - name: Run delivery-api integration tests
        working-directory: delivery-api
        env:
          NOTIFS_DELIVERY_URL: http://127.0.0.1:8300
          # Must equal DELIVERY_MAX_SCHEDULED_PER_APP on the stack started above.
          NOTIFS_DELIVERY_MAX_SCHEDULED: "2"
          NOTIFS_DELIVERY_TEST_DSN: postgres://delivery:delivery-local-dev@127.0.0.1:18300/delivery?sslmode=disable
        # -p 1: the packages share one database, and the pgstore test writes a transient failure row that /readyz would report
        run: go test -p 1 -tags integration ./...

      # The plain run above is on the default stack (hold on), so it already runs TestHold* except the
      # cap tests, which skip. The capped run: recreate delivery-api with small held caps, run the hold
      # runners, then the flag-off pass and the restore to the default below. The env keeps the
      # scheduled cap of 2 so the recreate does not drop it.
      - name: Recreate delivery-api with the hold flag on
        id: hold_recreate
        env:
          DELIVERY_MAX_SCHEDULED_PER_APP: "2"
          DELIVERY_HOLD_UNROUTED: "1"
          # Keep in sync with NOTIFS_DELIVERY_MAX_HELD in the next step (the live hold cap test fills it).
          DELIVERY_MAX_HELD_PER_APP: "3"
          # Keep in sync with NOTIFS_DELIVERY_MAX_HELD_TOTAL in the next step (the live total cap test fills it).
          DELIVERY_MAX_HELD_TOTAL: "20"
        run: |
          docker compose --project-directory . -f docker-compose.yml up -d --build delivery-api
          for _ in $(seq 1 60); do
            STATUS="$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose --project-directory . -f docker-compose.yml ps -q delivery-api)" || echo "unknown")"
            if [ "$STATUS" = "healthy" ]; then
              echo "delivery-api is healthy with the hold flag on"
              exit 0
            fi
            sleep 2
          done
          echo "delivery-api did not become healthy in time"
          exit 1

      # The runners target never touches the stack. A mis-set flag fails the tests' probe, and a runner
      # that ran zero hold tests fails the step. The make target cannot find this stack's containers
      # (different compose project name), so hand it the credential and the database container.
      - name: Run hold integration tests (Go + onboard unrouted path)
        env:
          NOTIFS_DELIVERY_HOLD_UNROUTED: "1"
          # Must equal DELIVERY_MAX_HELD_PER_APP on the stack recreated above.
          NOTIFS_DELIVERY_MAX_HELD: "3"
          # Must equal DELIVERY_MAX_HELD_TOTAL on the stack recreated above.
          NOTIFS_DELIVERY_MAX_HELD_TOTAL: "20"
        run: |
          set -o pipefail
          CRED="$(COMPOSE='docker compose --project-directory . -f docker-compose.yml' sh scripts/internal-credential.sh)"
          echo "::add-mask::$CRED"
          export NOTIFS_INTERNAL_CREDENTIAL="$CRED"
          NOTIFS_DELIVERY_DB_CONTAINER="$(docker compose --project-directory . -f docker-compose.yml ps -q delivery-postgres)"
          export NOTIFS_DELIVERY_DB_CONTAINER
          make delivery-integration-test-hold-run

      # The flag-off pass: recreate delivery-api with the hold flag explicitly off (the held-cap
      # overrides fall away; the scheduled cap of 2 is kept), then run the 422 tests.
      - name: Recreate delivery-api with the hold flag off
        env:
          DELIVERY_MAX_SCHEDULED_PER_APP: "2"
          DELIVERY_HOLD_UNROUTED: "0"
        run: |
          docker compose --project-directory . -f docker-compose.yml up -d --build delivery-api
          CONTAINER="$(docker compose --project-directory . -f docker-compose.yml ps -q delivery-api)"
          for _ in $(seq 1 60); do
            STATUS="$(docker inspect -f '{{.State.Health.Status}}' "$CONTAINER" || echo "unknown")"
            if [ "$STATUS" = "healthy" ]; then
              docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' "$CONTAINER" | grep -qx 'DELIVERY_HOLD_UNROUTED=0' || { echo "delivery-api is not flag-off"; exit 1; }
              echo "delivery-api is healthy with the hold flag off"
              exit 0
            fi
            sleep 2
          done
          echo "delivery-api did not become healthy in time"
          exit 1

      # The runner fails unless both WhenHoldOff tests pass (a skip fails it).
      - name: Run flag-off integration tests
        env:
          # The make recipe sets the URL and DSN itself (the Makefile defaults, 8300 and 18300).
          NOTIFS_DELIVERY_HOLD_UNROUTED: "0"
        run: |
          NOTIFS_DELIVERY_DB_CONTAINER="$(docker compose --project-directory . -f docker-compose.yml ps -q delivery-postgres)"
          export NOTIFS_DELIVERY_DB_CONTAINER
          make delivery-integration-test-hold-off-run

      # Always runs, so a failed hold or flag-off step cannot leave the later steps on a non-default
      # stack. DELIVERY_HOLD_UNROUTED and the held-cap overrides are left unset, so compose applies its
      # defaults (hold on, default caps); the scheduled cap of 2 is kept.
      - name: Restore delivery-api to the default
        if: always() && steps.hold_recreate.conclusion != 'skipped'
        env:
          DELIVERY_MAX_SCHEDULED_PER_APP: "2"
        run: |
          docker compose --project-directory . -f docker-compose.yml up -d --build delivery-api
          CONTAINER="$(docker compose --project-directory . -f docker-compose.yml ps -q delivery-api)"
          for _ in $(seq 1 60); do
            STATUS="$(docker inspect -f '{{.State.Health.Status}}' "$CONTAINER" || echo "unknown")"
            if [ "$STATUS" = "healthy" ]; then
              docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' "$CONTAINER" | grep -qx 'DELIVERY_HOLD_UNROUTED=1' || { echo "delivery-api is not on the default hold setting"; exit 1; }
              echo "delivery-api is healthy on the default hold setting"
              exit 0
            fi
            sleep 2
          done
          echo "delivery-api did not become healthy in time"
          exit 1

      # The make target cannot find this stack (different compose project name), so hand it the
      # provisioning-api credential straight from the running container, masked.
      - name: Run app onboarding integration test
        run: |
          set -o pipefail
          CRED="$(COMPOSE='docker compose --project-directory . -f docker-compose.yml' sh scripts/internal-credential.sh)"
          echo "::add-mask::$CRED"
          export NOTIFS_INTERNAL_CREDENTIAL="$CRED"
          make onboard-integration-test

      # Enforcement is live in this job, so a credential-less harness fails twice: as a 401 in its own
      # test and here as an audit hit (the audit also fails if the log is empty).
      - name: Audit provisioning-api for missing internal credentials
        run: |
          set -o pipefail
          docker compose --project-directory . -f docker-compose.yml logs --no-color provisioning-api | node scripts/credential-audit.mjs

      - name: Dump container state on failure
        if: failure()
        run: |
          docker compose --project-directory . -f docker-compose.yml ps
          docker compose --project-directory . -f docker-compose.yml logs

      - name: Tear down local stack
        if: always()
        run: docker compose --project-directory . -f docker-compose.yml down -v
