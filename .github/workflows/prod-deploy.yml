name: Deploy to production VPS

permissions:
  contents: read
  packages: read

on:
  workflow_call:
    secrets:
      PROD_SSH_HOST:
        required: true
      PROD_SSH_USERNAME:
        required: true
      PROD_SSH_PRIVATE_KEY_FILENAME:
        required: true
      PROD_SSH_PRIVATE_KEY_VALUE:
        required: true
      CF_ACCESS_CLIENT_ID:
        required: true
      CF_ACCESS_CLIENT_SECRET:
        required: true
      # Wave-2 person-service dual-write Access Service-Token credentials. Optional:
      # when unset they resolve to empty, written as empty ./secrets/* files, leaving
      # the dual-write auth unset (fails closed, swallowed — core provisioning unaffected).
      PERSON_SERVICE_ACCESS_CLIENT_ID:
        required: false
      PERSON_SERVICE_ACCESS_CLIENT_SECRET:
        required: false
      # ntfy iOS-bridge upstream poll rate-limit token for ntfy.sh. Optional: when the repo
      # secret is unset it resolves to empty, leaving the upstream bridge on ntfy.sh's
      # free/anonymous per-IP poll limit (fails open — iOS push still works, just rate-limited
      # under bulk/periodic sends). Unlike the PERSON_SERVICE_* Docker secrets above (delivered
      # as /run/secrets/*_FILE), ntfy needs this as a real ENV VAR, so it is exported into the
      # deploy shell just before `docker compose up` rather than written to a secrets file.
      NTFY_UPSTREAM_ACCESS_TOKEN:
        required: false
      # delivery-api Postgres password. Required: an empty value makes Postgres initdb fail, so the
      # deploy script below aborts before touching the running stack when it is empty. Must be
      # shell- and URL-safe (generate with `openssl rand -hex 32`) because it is interpolated
      # into the single-quoted ssh script.
      DELIVERY_DB_PASSWORD:
        required: true

jobs:
  ProdDeploy:
    name: Deploy docker compose stack to the production VPS
    runs-on: ubuntu-latest

    steps:
      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SSH_PRIVATE_KEY_VALUE }}" > ~/.ssh/${{ secrets.PROD_SSH_PRIVATE_KEY_FILENAME }}
          chmod 600 ~/.ssh/${{ secrets.PROD_SSH_PRIVATE_KEY_FILENAME }}

      - name: Install Cloudflared
        run: |
          sudo curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /usr/bin/cloudflared
          sudo chmod a+x /usr/bin/cloudflared

      # Special config file required for cloudflared tunnel ssh connection
      - name: Prepare SSH Config file
        run: |
          cat <<EOF > ~/.ssh/config
          Host ${{ secrets.PROD_SSH_HOST }}
            HostName ${{ secrets.PROD_SSH_HOST }}
            User ${{ secrets.PROD_SSH_USERNAME }}
            IdentityFile ~/.ssh/${{ secrets.PROD_SSH_PRIVATE_KEY_FILENAME }}
            IdentitiesOnly yes
            AddKeysToAgent yes
            ProxyCommand /usr/bin/cloudflared access ssh --hostname %h --id ${{ secrets.CF_ACCESS_CLIENT_ID }} --secret ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          EOF

          chmod 600 ~/.ssh/config

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          persist-credentials: false

      - name: Create stack directory on VPS
        run: |
          ssh -T -q -o StrictHostKeyChecking=no ${{ secrets.PROD_SSH_HOST }} 'mkdir -p /home/4irl-notifs/ntfy'

      - name: SCP Compose File Into Production Server
        run: |
          scp -T -q -o StrictHostKeyChecking=no docker-compose.prod.yml ${{ secrets.PROD_SSH_HOST }}:/home/4irl-notifs/

      - name: SCP ntfy Config Into Production Server
        run: |
          scp -T -q -o StrictHostKeyChecking=no ntfy/server.yml ${{ secrets.PROD_SSH_HOST }}:/home/4irl-notifs/ntfy/

      # Pull updated images, recreate only what changed, run as daemon, and prune old images.
      # Secret handling mirrors urls4irl: the person-service Access Service-Token credentials
      # are delivered as Docker Compose secrets. The step below writes ./secrets/* from the
      # GitHub Actions secrets of the same name just before `up` (so compose can mount them at
      # /run/secrets), then `rm -rf ./secrets/` immediately after — no plaintext secret persists
      # on the host, and none enters the container environment. The ntfy iOS-bridge upstream
      # token (NTFY_UPSTREAM_ACCESS_TOKEN) is the exception: ntfy reads it as a real ENV VAR,
      # not a /run/secrets/*_FILE, so it is `export`ed into this deploy shell just before `up`
      # (empty when the repo secret is unset — fails open to the free bridge; never echoed, and
      # not written to disk). Non-secret hostnames (NTFY_BASE_URL, PERSON_SERVICE_URL) stay
      # baked into the compose file's defaults.
      #
      # The delivery-api DB password is the deliberate exception to the delete-after-up rule:
      # it is written to ./secrets-persistent/ (dir 0700, file 0644) and NEVER deleted, because
      # delivery-api and delivery-migrate read it on every start (not only at Postgres initdb
      # like the secrets above). The `rm -rf ./secrets/` below does not touch that directory.
      # The secret is validated (non-empty hex, 32+ chars) at the very top of the script, before
      # anything is written: an invalid value aborts leaving the running stack and any existing
      # persistent password file untouched, and writes no ./secrets/* or docker login material.
      #
      # Why the file is 0644, not 0600: the deploy user on the VPS (site-ops, uid 1001) owns the
      # file, but delivery-api / delivery-migrate run as uid 1000 (notifs) and must be able to
      # read the bind-mounted secret; a 0600 file owned by uid 1001 would be unreadable to them
      # (Postgres is fine either way: its entrypoint reads the file as root). The 0700 directory
      # is the real access boundary, exactly like ./secrets/ (0700 dir, default-umask files).
      #
      # `up -d` WITHOUT --force-recreate is deliberate: compose diffs image digest + compose
      # definition and recreates ONLY the services that changed. A typical API-only deploy
      # (new provisioning-api :latest) therefore recreates just provisioning-api and leaves
      # the ntfy container running — its long-lived subscriber connections survive the deploy.
      # Caveat: compose does NOT watch bind-mounted FILE CONTENTS, so a change to
      # ntfy/server.yml alone won't restart ntfy. When you change ntfy config, run a targeted
      # `docker compose up -d --force-recreate ntfy` manually. An ntfy VERSION bump IS a compose
      # definition change (image tag), so it recreates ntfy automatically on the next deploy.
      - name: Deploy Docker Compose Stack
        run: |
          ssh -T -q -o StrictHostKeyChecking=no ${{ secrets.PROD_SSH_HOST }} '
          cd /home/4irl-notifs;
          DELIVERY_DB_PASSWORD_VALUE="${{ secrets.DELIVERY_DB_PASSWORD }}";
          printf "%s" "${DELIVERY_DB_PASSWORD_VALUE}" | grep -Eqx "[0-9a-f]{32,}" || { echo "DELIVERY_DB_PASSWORD secret is missing, empty, or not hex (openssl rand -hex 32); aborting before touching the stack"; exit 1; };
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin;

          mkdir -p ./secrets/;
          chmod 700 ./secrets/;
          echo "${{ secrets.PERSON_SERVICE_ACCESS_CLIENT_ID }}" > ./secrets/PERSON_SERVICE_ACCESS_CLIENT_ID;
          echo "${{ secrets.PERSON_SERVICE_ACCESS_CLIENT_SECRET }}" > ./secrets/PERSON_SERVICE_ACCESS_CLIENT_SECRET;

          mkdir -p ./secrets-persistent/;
          chmod 700 ./secrets-persistent/;
          printf "%s" "${DELIVERY_DB_PASSWORD_VALUE}" > ./secrets-persistent/DELIVERY_DB_PASSWORD;
          chmod 644 ./secrets-persistent/DELIVERY_DB_PASSWORD;
          [ -s ./secrets-persistent/DELIVERY_DB_PASSWORD ] || { echo "DELIVERY_DB_PASSWORD file is empty after write; aborting"; exit 1; };

          docker compose -f docker-compose.prod.yml pull;
          export NTFY_UPSTREAM_ACCESS_TOKEN="${{ secrets.NTFY_UPSTREAM_ACCESS_TOKEN }}";
          docker compose -f docker-compose.prod.yml up -d --remove-orphans;
          docker image prune -f;

          echo "Removing on-host secret material (already mounted into the container)...";
          rm -rf ./secrets/;

          echo "Cleaning up docker login files..."
          rm -f ~/.docker/config.json
          ';

      # Verify the stack after any updates. Retries up to 30 x 5s (the wait mechanism, replacing
      # a fixed sleep) until ALL hold: ntfy, provisioning-api and delivery-postgres are running,
      # the one-shot delivery-migrate job exited 0, and delivery-api answers /readyz on
      # 127.0.0.1:8300 (DB reachable and schema current). On final failure it names the failed
      # checks and dumps the delivery logs.
      - name: Verify Docker Compose Stack
        run: >
          ssh -T -q -o StrictHostKeyChecking=no ${{ secrets.PROD_SSH_HOST }} '
          cd /home/4irl-notifs;
          failed="";
          for attempt in $(seq 1 30); do
            failed="";
            running=$(docker compose -f docker-compose.prod.yml ps --services --filter "status=running");
            echo "${running}" | grep -qx ntfy || failed="${failed} ntfy-not-running";
            echo "${running}" | grep -qx provisioning-api || failed="${failed} provisioning-api-not-running";
            echo "${running}" | grep -qx delivery-postgres || failed="${failed} delivery-postgres-not-running";
            migrateState=$(docker inspect -f "{{.State.Status}}:{{.State.ExitCode}}" 4irl-notifs-delivery-migrate 2>/dev/null);
            [ "${migrateState}" = "exited:0" ] || failed="${failed} delivery-migrate-not-exited-0(${migrateState:-missing})";
            curl -fsS http://127.0.0.1:8300/readyz > /dev/null 2>&1 || failed="${failed} delivery-api-readyz-failing";
            if [ -z "${failed}" ]; then
              echo "All services are up (attempt ${attempt})!";
              exit 0;
            fi;
            echo "Attempt ${attempt}/30 not ready:${failed}";
            sleep 5;
          done;
          echo "After 150 seconds, the stack is not healthy:${failed}";
          docker compose -f docker-compose.prod.yml ps -a;
          docker compose -f docker-compose.prod.yml logs --tail 100 delivery-migrate delivery-api delivery-postgres;
          exit 1;
          '
