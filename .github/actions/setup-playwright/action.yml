name: 'setup playwright'
description: >-
  Installs Playwright's browsers and their system packages (`playwright install --with-deps`) and
  survives a broken runner resolver: each try is time-boxed, a failed try is retried after a pause,
  the runner's DNS is pointed at 1.1.1.1 when the Ubuntu apt mirror name does not resolve, and every
  failure prints the resolver state so the log alone names the cause. Needs the repo checked out and
  the calling project's dependencies installed first (`npx` resolves its pinned Playwright).

inputs:
  working-directory:
    description: Directory whose package.json pins `@playwright/test` (e.g. `web`, `setup-web`).
    required: true
  browsers:
    description: Space-separated browsers to install.
    required: false
    default: 'chromium'
  attempts:
    description: How many times to try the install before failing the job.
    required: false
    default: '3'
  attempt-timeout-minutes:
    description: >-
      Time limit for one try. A healthy install takes about a minute; without a limit apt's own
      retries kept one failing try alive for about 10 minutes.
    required: false
    default: '4'

runs:
  using: composite
  steps:
    - name: Install Playwright browsers
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        BROWSERS: ${{ inputs.browsers }}
        ATTEMPTS: ${{ inputs.attempts }}
        ATTEMPT_TIMEOUT_MINUTES: ${{ inputs.attempt-timeout-minutes }}
      run: |
        # GitHub runs `bash -e`; the retry loop must see a failed install, not abort on it.
        set +e
        set -uo pipefail

        # apt's mirror list (mirror+file:/etc/apt/apt-mirrors.txt) points at this host.
        MIRROR_HOST="azure.archive.ubuntu.com"
        # Ubuntu's authoritative nameservers (ns*.canonical.com) can be unreachable from the runner's
        # Azure resolver while public resolvers still answer, so every Ubuntu name times out.
        FALLBACK_DNS_SERVERS="1.1.1.1 1.0.0.1"
        # A failing lookup otherwise blocks about 20s each, which made one diagnostics dump take minutes.
        LOOKUP_TIMEOUT_SECONDS=5

        lookup_ok() {
          timeout "$LOOKUP_TIMEOUT_SECONDS" getent hosts "$1" > /dev/null
        }

        # Name resolution and apt run through the same resolver, so a failed lookup here predicts
        # the apt failure before it burns a try.
        print_diagnostics() {
          echo "::group::DNS diagnostics"
          echo "--- /etc/resolv.conf"
          cat /etc/resolv.conf || true
          echo "--- resolvectl status"
          resolvectl status 2>&1 | head -30 || true
          for host in "$MIRROR_HOST" ubuntu-archive-asm.trafficmanager.net archive.ubuntu.com security.ubuntu.com; do
            if lookup_ok "$host"; then
              echo "lookup ok:   $host"
            else
              echo "lookup FAIL: $host"
            fi
          done
          echo "::endgroup::"
        }

        use_fallback_dns_if_mirror_unresolvable() {
          if lookup_ok "$MIRROR_HOST"; then
            return 0
          fi
          echo "::warning::$MIRROR_HOST does not resolve; pointing the runner's DNS at $FALLBACK_DNS_SERVERS"
          print_diagnostics
          local default_interface
          default_interface=$(ip route show default | awk '{for (i = 1; i < NF; i++) if ($i == "dev") {next_field = i + 1; print $next_field; exit}}')
          if [[ -z "$default_interface" ]]; then
            echo "::warning::no default network interface found; leaving DNS unchanged"
            return 0
          fi
          # FALLBACK_DNS_SERVERS is intentionally unquoted so each server becomes its own argument.
          # shellcheck disable=SC2086
          sudo resolvectl dns "$default_interface" $FALLBACK_DNS_SERVERS
          sudo resolvectl flush-caches
          if lookup_ok "$MIRROR_HOST"; then
            echo "DNS override worked: $MIRROR_HOST resolves via $FALLBACK_DNS_SERVERS on $default_interface"
          else
            echo "::warning::$MIRROR_HOST still does not resolve after the DNS override"
          fi
        }

        for attempt in $(seq 1 "$ATTEMPTS"); do
          use_fallback_dns_if_mirror_unresolvable
          echo "playwright install: attempt $attempt of $ATTEMPTS (limit ${ATTEMPT_TIMEOUT_MINUTES}m)"
          start_seconds=$SECONDS
          # BROWSERS is intentionally unquoted so a space-separated list becomes separate args.
          # shellcheck disable=SC2086
          timeout --kill-after=30s "${ATTEMPT_TIMEOUT_MINUTES}m" npx playwright install --with-deps $BROWSERS
          install_rc=$?
          echo "playwright install: attempt $attempt rc=$install_rc after $((SECONDS - start_seconds))s"
          if [[ "$install_rc" -eq 0 ]]; then
            exit 0
          fi
          print_diagnostics
          # A timed-out apt can leave dpkg half-configured, which would fail the next try.
          sudo dpkg --configure -a || true
          if [[ "$attempt" -lt "$ATTEMPTS" ]]; then
            sleep $((attempt * 20))
          fi
        done

        echo "::error::playwright install failed after $ATTEMPTS attempts"
        exit 1
